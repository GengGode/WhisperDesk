[env]
LIBCLANG_PATH = { value = "../.env/llvm/bin", relative = true }
# 关闭 native 编译，让 ggml CUDA 后端生成包含 PTX 的通用产物，
# 使编译结果可在不同架构的 GPU 上通过 JIT 运行（如从 Ampere 编译后在 Blackwell 上运行）
GGML_NATIVE = "OFF"
# 指向 GPU 版本的 sherpa-onnx 预编译库（CUDA 12.x + cuDNN 9.x），
# 覆盖 sherpa-onnx-sys 默认下载的 CPU-only 版本
SHERPA_ONNX_LIB_DIR = { value = "../.env/sherpa-onnx/sherpa-onnx-v1.13.0-cuda-12.x-cudnn-9.x-win-x64-cuda/lib", relative = true }
