[package]
name = "whisper-desk"
version = "0.1.0"
description = "WhisperDesk - 本地语音转录桌面应用"
authors = ["YuSuiXian"]
edition = "2021"

[features]
default = ["whisper-rs-backend", "sherpa-onnx-backend", "cuda"]
whisper-rs-backend = ["dep:whisper-rs"]
sherpa-onnx-backend = ["dep:sherpa-onnx"]
cuda = ["whisper-rs-backend", "whisper-rs/cuda"]

[lib]
name = "whisper_desk_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
whisper-rs = { version = "0.16", optional = true }
sherpa-onnx = { version = "1.13", optional = true, default-features = false, features = ["shared"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "multipart", "socks"] }
tar = "0.4"
bzip2 = "0.5"
symphonia = { version = "0.5", features = ["mp3", "aac", "flac", "vorbis", "isomp4", "ogg", "wav"] }
axum = { version = "0.8", features = ["multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
rust-embed = { version = "8", features = ["interpolate-folder-path", "include-exclude"] }
mime_guess = "2"
tokio-stream = "0.1"
eventsource-stream = "0.2"

# dev 模式下对音频解码库开编译优化，否则解码极慢
[profile.dev.package.symphonia]
opt-level = 2
[profile.dev.package.symphonia-core]
opt-level = 2
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 2
[profile.dev.package.symphonia-codec-aac]
opt-level = 2
[profile.dev.package.symphonia-format-isomp4]
opt-level = 2
[profile.dev.package.symphonia-codec-vorbis]
opt-level = 2

