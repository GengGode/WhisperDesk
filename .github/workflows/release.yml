name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            features: whisper-rs-backend
            suffix: cpu
            cuda: false
            os: windows-latest
          - variant: cuda
            features: whisper-rs-backend,cuda
            suffix: cuda
            cuda: true
            os: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.variant }}
          shared-key: release
          cache-on-failure: true

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18.1.8"
          cached: true

      - name: Install CUDA Toolkit
        if: matrix.cuda
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.4.1"
          use-github-cache: true
          use-local-cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm tauri build -- --no-default-features --features ${{ matrix.features }}
        env:
          LIBCLANG_PATH: ${{ env.LLVM_PATH }}/bin

      - name: Rename artifacts
        shell: pwsh
        run: |
          $suffix = "${{ matrix.suffix }}"
          $patterns = @(
            "src-tauri/target/release/bundle/nsis/*.exe",
            "src-tauri/target/release/bundle/msi/*.msi"
          )
          Get-ChildItem -Path $patterns -ErrorAction SilentlyContinue | ForEach-Object {
            $newName = "{0}-{1}{2}" -f $_.BaseName, $suffix, $_.Extension
            Rename-Item -LiteralPath $_.FullName -NewName $newName
            Write-Host "Renamed: $($_.Name) -> $newName"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whisperdesk-${{ matrix.suffix }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    name: publish-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: whisperdesk-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WhisperDesk ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/**/*
